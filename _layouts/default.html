<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#09080d">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Zawin Awatif, home"><span class="brand-mark" aria-hidden="true">Z</span><span>ZAWIN AWATIF<span class="brand-subtitle">CYBERSECURITY PORTFOLIO</span></span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#skills' | relative_url }}">Skills</a>
        <a href="{{ '/#certifications' | relative_url }}">Training</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#journey' | relative_url }}">Journey</a>
        <a class="nav-contact" href="{{ '/#contact' | relative_url }}">Contact <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <p>© 2026 Zawin Awatif · Cybersecurity Portfolio</p>
      <a href="#main-content">Back to Top ↑</a>
    </footer>
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}"></script>
  </body>
</html>
